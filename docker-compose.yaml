version: '3.8'

services:
  mhw-api:
    build: .
    container_name: mhw-pytorch-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Jakarta
    # Opsional: Uncomment jika menggunakan GPU NVIDIA dengan PyTorch
