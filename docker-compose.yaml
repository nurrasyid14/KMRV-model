services:
  # 1. Database PostgreSQL dengan ekstensi PostGIS (Spasial)
  postgres-db:
    image: postgis/postgis:15-3.3
    container_name: mhw_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_MEMBER_USER: ${DB_MEMBER_USER:?Set DB_MEMBER_USER in .env}
      DB_MEMBER_PASSWORD: ${DB_MEMBER_PASSWORD:?Set DB_MEMBER_PASSWORD in .env}
      TZ: Asia/Jakarta
    ports:
      - "${POSTGRES_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Final ENSO model inference service
  model-service:
    build:
      context: .
      dockerfile: model/Dockerfile
    container_name: mhw_pytorch_service
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./model/final_retrained:/app/models/final_retrained:ro
      - ./dataset/features_master_unscaled.csv:/app/dataset/features_master_unscaled.csv:ro
    environment:
      - TZ=Asia/Jakarta
      - PYTHONUNBUFFERED=1
      - MODEL_ARTIFACTS_DIR=/app/models/final_retrained
      - FEATURES_FILE=/app/dataset/features_master_unscaled.csv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  # 3. FastAPI Backend API
  fastapi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mhw_fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MODEL_SERVICE_URL=http://model-service:8001
      - TZ=Asia/Jakarta
    depends_on:
      model-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # 4. Frontend Web Server (Nginx melayani HTML/CSS/JS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mhw_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      fastapi-backend:
        condition: service_healthy

volumes:
  postgres_data: