version: '3.8'

services:
  # 1. Database PostgreSQL dengan ekstensi PostGIS (Spasial)
  postgres-db:
    image: postgis/postgis:15-3.3
    container_name: mhw_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_MEMBER_USER: ${DB_MEMBER_USER:?Set DB_MEMBER_USER in .env}
      DB_MEMBER_PASSWORD: ${DB_MEMBER_PASSWORD:?Set DB_MEMBER_PASSWORD in .env}
      TZ: Asia/Jakarta
    ports:
      - "${POSTGRES_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. PyTorch Model Inference Service (Deep Learning & NetCDF Processing)
  model-service:
    build:
      context: ./model
      dockerfile: Dockerfile
    container_name: mhw_pytorch_service
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./model/models:/app/models
      - ./model/data:/app/data
    environment:
      - TZ=Asia/Jakarta
      - PYTHONUNBUFFERED=1
    # Jika menggunakan GPU NVIDIA, hapus komentar pada blok di bawah:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 3. FastAPI Backend API
  fastapi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mhw_fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${DB_MEMBER_USER}:${DB_MEMBER_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      - MODEL_SERVICE_URL=http://model-service:8001
      - TZ=Asia/Jakarta
    depends_on:
      postgres-db:
        condition: service_healthy
      model-service:
        condition: service_started

  # 4. Frontend Web Server (Nginx melayani HTML/CSS/JS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mhw_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - fastapi-backend

volumes:
  postgres_data: